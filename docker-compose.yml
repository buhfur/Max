services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-data:/var/cache/searxng:rw

    networks:
      open-webui-network:
        ipv4_address: 172.19.1.2



  open-terminal:
    #image: ghcr.io/open-webui/open-terminal:latest
    build:
      context: /home/buhfur/Max/open-terminal
      dockerfile: Dockerfile
    container_name: open-terminal
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - /home/max:/home/open-terminal

    working_dir: /home/open-terminal

    user: "1001:1001" # Runs container under max user 

    pid: host # Runs the container under the same PID namespace as the specified user ID above 
    env_file:
      - .env

    environment:
      TINI_SUBREAPER: "1" # Changes PID of tini of init due to pid: host option   
      HOME: /home/open-terminal # Home directory inside container
      PATH: /home/open-terminal/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin

    networks:
      open-webui-network:
        ipv4_address: 172.19.1.3


  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped

    ports:
      - "3000:8080"

    volumes:
      - open-webui-data:/app/backend/data

    env_file:
      - .env
    environment:
      # SearXNG
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
      OLLAMA_BASE_URL: "http://172.17.0.1:11434"

    depends_on:
      - searxng
      - open-terminal

    networks:
      open-webui-network:
        ipv4_address: 172.19.1.4






# ============ End services config =============

volumes:
  open-webui-data:
  open-terminal-data:
  searxng-data:



networks:
  open-webui-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.1.0/24 
          gateway: 172.19.1.1
